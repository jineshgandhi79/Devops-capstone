name: DevTrack Todo CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "demo/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase
  IMAGE_PREFIX: ghcr.io/jineshgandhi79/devtrack

jobs:
  # ---------------------------------------------------------------
  # Stage 1: quality gates
  # ---------------------------------------------------------------
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d devtrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/devtrack
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to PostgreSQL
        run: |
          alembic upgrade head
          alembic check

      - name: Run pytest
        run: pytest -v

  frontend-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ---------------------------------------------------------------
  # Stage 2: build, scan and publish images
  # ---------------------------------------------------------------
  docker-build:
    name: Build, scan & push (${{ matrix.component }})
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy vulnerability & secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SHA and latest tags
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------
  # Stage 3: GitOps deploy — pin the new SHA in the Helm values.
  # ArgoCD watches helm/devtrack and rolls the cluster forward.
  # ---------------------------------------------------------------
  deploy:
    name: Update Helm image tags (GitOps)
    needs: docker-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin image tags to ${{ github.sha }}
        run: |
          sed -i -E 's|^(    tag: ")[^"]*(".*# pinned to the commit SHA.*)$|\1${{ github.sha }}\2|' helm/devtrack/values.yaml
          grep -n 'tag:' helm/devtrack/values.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Image tags already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: pin images to ${GITHUB_SHA::7} [skip ci]"
          git push
