# Default values for DevTrack Helm Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

environment: "production"

namespace:
  create: true
  name: "devtrack"

frontend:
  replicaCount: 3
  image:
    repository: "ghcr.io/jineshgandhi79/devtrack-frontend"
    tag: "f377ec6c8d3c7af7b2758e5fcb75a89b1a571823"  # pinned to the commit SHA by the CI deploy job
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

backend:
  replicaCount: 2
  image:
    repository: "ghcr.io/jineshgandhi79/devtrack-backend"
    tag: "f377ec6c8d3c7af7b2758e5fcb75a89b1a571823"  # pinned to the commit SHA by the CI deploy job
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

database:
  name: "devtrack"
  user: "postgres"
  password: "postgrespassword"
  port: 5432
  image:
    repository: "postgres"
    tag: "16-alpine"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: "1Gi"
    accessMode: "ReadWriteOnce"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
