{{- if .Values.database.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devtrack-postgres-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "devtrack.labels" . | nindent 4 }}
    app.kubernetes.io/name: devtrack-postgres
    app.kubernetes.io/component: database
spec:
  accessModes:
    - {{ .Values.database.persistence.accessMode }}
  storageClassName: {{ .Values.database.persistence.storageClass | default "gp2" }}
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
{{- end }}
