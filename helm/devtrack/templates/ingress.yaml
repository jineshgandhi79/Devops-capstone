{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtrack-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "devtrack.labels" . | nindent 4 }}
    app.kubernetes.io/name: devtrack-ingress
    environment: {{ .Values.environment }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devtrack-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: devtrack-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: devtrack-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devtrack-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
