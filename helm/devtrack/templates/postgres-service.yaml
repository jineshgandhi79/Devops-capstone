apiVersion: v1
kind: Service
metadata:
  name: devtrack-postgres
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "devtrack.labels" . | nindent 4 }}
    app.kubernetes.io/name: devtrack-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devtrack-postgres
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
      protocol: TCP
