apiVersion: v1
kind: Secret
metadata:
  name: devtrack-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "devtrack.labels" . | nindent 4 }}
    app.kubernetes.io/name: devtrack-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@devtrack-postgres:%v/%s" .Values.database.user .Values.database.password .Values.database.port .Values.database.name | quote }}
