apiVersion: v1
kind: Service
metadata:
  name: devtrack-postgres
  namespace: devtrack
  labels:
    app.kubernetes.io/name: devtrack-postgres
    app.kubernetes.io/part-of: devtrack
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devtrack-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
