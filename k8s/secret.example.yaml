apiVersion: v1
kind: Secret
metadata:
  name: devtrack-secret
  namespace: devtrack
  labels:
    app.kubernetes.io/name: devtrack-secret
    app.kubernetes.io/part-of: devtrack
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
  database-url: "postgresql+psycopg://postgres:CHANGE_ME_SECURE_PASSWORD@devtrack-postgres:5432/devtrack"
