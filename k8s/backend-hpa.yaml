apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devtrack-backend
  namespace: devtrack
  labels:
    app.kubernetes.io/name: devtrack-backend
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devtrack-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
