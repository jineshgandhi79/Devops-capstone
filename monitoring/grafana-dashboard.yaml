apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devtrack-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevTrack Dashboards'
        orgId: 1
        folder: 'DevTrack'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards-json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-devtrack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devtrack-observability
data:
  devtrack-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "System Health & Overview",
          "type": "row"
        },
        {
          "id": 1,
          "title": "Backend Availability",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "avg(up{job=\"devtrack-backend\"}) * 100",
              "legendFormat": "Availability (%)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 100 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Total HTTP Requests",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "sum(devtrack_http_requests_total{job=\"devtrack-backend\"}) or vector(0)",
              "legendFormat": "Total Requests",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 3,
          "title": "Error Rate (5xx)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "(sum(rate(devtrack_http_requests_total{job=\"devtrack-backend\", status_code=~\"5..\"}[1m])) or vector(0)) / (sum(rate(devtrack_http_requests_total{job=\"devtrack-backend\"}[1m])) > 0) * 100 or vector(0)",
              "legendFormat": "Error Rate (%)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Application Version",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "devtrack_app_info{job=\"devtrack-backend\"}",
              "legendFormat": "{{version}}",
              "refId": "A"
            }
          ],
          "options": {
            "textMode": "name"
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 101,
          "title": "HTTP Traffic & Latency Performance",
          "type": "row"
        },
        {
          "id": 5,
          "title": "HTTP Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "sum(rate(devtrack_http_requests_total{job=\"devtrack-backend\"}[1m])) by (endpoint, status_code)",
              "legendFormat": "{{endpoint}} [{{status_code}}]",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        },
        {
          "id": 6,
          "title": "P95 Request Latency by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(devtrack_http_request_duration_seconds_bucket{job=\"devtrack-backend\"}[1m])) by (le, endpoint))",
              "legendFormat": "{{endpoint}} (p95)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 102,
          "title": "Runtime Resource Utilization",
          "type": "row"
        },
        {
          "id": 7,
          "title": "Process Resident Memory (RSS)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "sum(process_resident_memory_bytes{job=\"devtrack-backend\"}) by (instance)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Process CPU Usage Rate",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
          "targets": [
            {
              "expr": "sum(rate(process_cpu_seconds_total{job=\"devtrack-backend\"}[1m])) by (instance)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["devtrack", "fastapi", "observability"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m"]
      },
      "timezone": "browser",
      "title": "DevTrack — Application Observability & Performance",
      "uid": "devtrack-app-overview",
      "version": 1
    }
