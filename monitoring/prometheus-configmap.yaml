apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devtrack-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "devtrack-backend"
        metrics_path: "/metrics"
        scrape_interval: 15s
        static_configs:
          - targets: ["devtrack-backend.devtrack.svc.cluster.local:8000"]
            labels:
              app: "devtrack-backend"
              environment: "production"
              framework: "fastapi"
